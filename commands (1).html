<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>
</head>
<body>
<script>
const CLIENT_ID   = "d3a8ea6d-6deb-402c-9d80-f131c327fed9";
const TENANT_ID   = "7a913d1c-9ea9-4a2a-b72a-4e9efd358b45";
const LOGO_HE_URL = "https://eliaelyatim1.github.io/addin/logoHE.png";
const INSTA_URL   = "https://eliaelyatim1.github.io/addin/ins.png";
const INSTA_LINK  = "https://www.instagram.com/work_at_tevel_";

const msalConfig = {
    auth: {
        clientId: CLIENT_ID,
        authority: `https://login.microsoftonline.com/${TENANT_ID}`,
        redirectUri: "https://eliaelyatim1.github.io/addin/taskpane-1.html"
    },
    cache: { cacheLocation: "sessionStorage" }
};

Office.onReady(function() {});

async function autoInsertSignature(event) {
    try {
        const msalInstance = new msal.PublicClientApplication(msalConfig);
        await msalInstance.initialize();

        let token;
        const accounts = msalInstance.getAllAccounts();
        if (accounts.length > 0) {
            try {
                const result = await msalInstance.acquireTokenSilent({
                    scopes: ["User.Read"],
                    account: accounts[0]
                });
                token = result.accessToken;
            } catch (e) {
                event.completed();
                return;
            }
        } else {
            event.completed();
            return;
        }

        const res = await fetch(
            "https://graph.microsoft.com/v1.0/me?$select=displayName,jobTitle,mail,mobilePhone,officeLocation,city",
            { headers: { Authorization: "Bearer " + token } }
        );
        const user = await res.json();

        const name  = user.city           || "";
        const title = user.officeLocation || "";
        const email = user.mail           || "";
        const phone = user.mobilePhone    || "";

        const signature = `
<table cellspacing="0" cellpadding="0" dir="rtl" style="font-family:'Assistant',Arial,sans-serif; text-align:right;">
  <tr>
    <td valign="middle" style="padding-left:12px; border-left:2px solid #000; text-align:right;">
      <img src="${LOGO_HE_URL}" width="100" height="145" style="width:100px; height:145px; display:block; border:0;">
    </td>
    <td valign="top" style="padding-right:12px; line-height:1.6; text-align:right;" dir="rtl">
      <span style="font-size:16px; font-weight:bold; color:#000;">${name}</span><br>
      ${title ? `<span style="font-size:14px; font-weight:bold; color:#333;">${title}</span><br>` : ""}
      <span style="font-size:13px; color:#444;">תבל מטרו מקבוצת אגד</span><br>
      ${email ? `<span style="font-size:13px; color:#333;">${email}</span><br>` : ""}
      ${phone ? `<span style="font-size:13px; color:#333;">&#x202A;${phone}&#x202C;</span>` : ""}
      <table cellspacing="0" cellpadding="0" style="margin-top:4px;">
        <tr>
          <td><a href="https://www.tevelmetro.co.il" target="_blank"><img src="https://eliaelyatim1.github.io/addin/tvl.png" width="26" style="display:block; border:0;"></a></td>
          <td style="padding-left:4px;"><a href="https://www.egged.co.il/" target="_blank"><img src="https://eliaelyatim1.github.io/addin/egged.png" width="28" style="display:block; border:0;"></a></td>
          <td style="padding-left:4px;"><a href="https://www.dankal.co.il/" target="_blank"><img src="https://eliaelyatim1.github.io/addin/dan.png" width="28" style="display:block; border:0;"></a></td>
          <td style="padding-left:4px;"><a href="https://www.linkedin.com/company/tevel-metro/" target="_blank"><img src="https://eliaelyatim1.github.io/addin/link.png" width="28" style="display:block; border:0;"></a></td>
          <td style="padding-left:4px;"><a href="${INSTA_LINK}" target="_blank"><img src="${INSTA_URL}" width="28" style="display:block; border:0;"></a></td>
        </tr>
      </table>
    </td>
  </tr>
</table>`;

        await Office.context.mailbox.item.body.setSignatureAsync(
            signature,
            { coercionType: Office.CoercionType.Html }
        );

    } catch (err) {
        console.error("Auto signature error:", err);
    }

    event.completed();
}
</script>
</body>
</html>
