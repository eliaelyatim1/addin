Office.onReady(function() {
    Office.actions.associate("autoInsertSignature", autoInsertSignature);
});

async function autoInsertSignature(event) {
    try {
        const msalInstance = new msal.PublicClientApplication(msalConfig);
        await msalInstance.initialize();

        let token;
        const accounts = msalInstance.getAllAccounts();
        if (accounts.length > 0) {
            try {
                const result = await msalInstance.acquireTokenSilent({
                    scopes: ["User.Read"],
                    account: accounts[0]
                });
                token = result.accessToken;
            } catch (e) {
                event.completed();
                return;
            }
        } else {
            event.completed();
            return;
        }

        const res = await fetch(
            "https://graph.microsoft.com/v1.0/me?$select=displayName,jobTitle,mail,mobilePhone,officeLocation,city",
            { headers: { Authorization: "Bearer " + token } }
        );
        const user = await res.json();

        const title = user.officeLocation || "";
        const email = user.mail           || "";
        const phone = user.mobilePhone    || "";
