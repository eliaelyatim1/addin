async function insertSignature(lang) {
    const status = document.getElementById("status");
    const error  = document.getElementById("error");
    status.textContent = "טוען פרטי משתמש...";
    error.textContent  = "";

    try {
        const token = await getToken();
        const user  = await fetchUser(token);
        const sig   = lang === 'he' ? buildSignatureHe(user) : buildSignatureEn(user);
        await insertToEmail(sig);
        status.textContent = lang === 'he' ? "✅ חתימה בעברית הוכנסה בהצלחה" : "✅ חתימה באנגלית הוכנסה בהצלחה";
    } catch (err) {
        error.textContent  = "שגיאה: " + err.message;
        status.textContent = "";
        console.error(err);
    }
}

async function getToken() {
    await msalInstance.initialize();

    // שלוף את המייל של המשתמש הנוכחי מ-Outlook
    const currentEmail = Office.context.mailbox.userProfile.emailAddress;

    const accounts = msalInstance.getAllAccounts();

    // חפש חשבון מתאים לפי מייל
    const matchingAccount = accounts.find(a =>
        a.username.toLowerCase() === currentEmail.toLowerCase()
    );

    if (matchingAccount) {
        try {
            const result = await msalInstance.acquireTokenSilent({
                scopes,
                account: matchingAccount
            });
            return result.accessToken;
        } catch (e) {}
    }

    // Popup עם hint למייל הנכון — לא ישאל על איזה חשבון
    const result = await msalInstance.acquireTokenPopup({
        scopes,
        loginHint: currentEmail
    });
    return result.accessToken;
}

async function fetchUser(token) {
    const res = await fetch(
        "https://graph.microsoft.com/v1.0/me?$select=displayName,jobTitle,mail,mobilePhone,officeLocation,city",
        { headers: { Authorization: "Bearer " + token } }
    );
    if (!res.ok) throw new Error("שגיאה בשליפת נתוני משתמש");
    return await res.json();
}

// הכנס לגוף המייל
// =============================================
function insertToEmail(signature) {
    return new Promise((resolve, reject) => {
        Office.context.mailbox.item.body.setSignatureAsync(
            signature,
            { coercionType: Office.CoercionType.Html },
            function(result) {
                if (result.status === Office.AsyncResultStatus.Succeeded) {
                    resolve();
                } else {
                    Office.context.mailbox.item.body.setSelectedDataAsync(
                        signature,
                        { coercionType: Office.CoercionType.Html },
                        function(r) {
                            if (r.status === Office.AsyncResultStatus.Succeeded) resolve();
                            else reject(new Error("לא ניתן להכניס חתימה"));
                        }
                    );
                }
            }
        );
    });
}
